# Polymarket Forecast Lab configuration.
# All defaults are documented; change values here, not in code.

# --- Universe -----------------------------------------------------------
universe:
  # One universe sync per hour (brief section 3).
  sync_interval_minutes: 60
  # Binary markets only in v1.
  binary_only: true
  # Skip sub-24h crypto "pulse" markets entirely (brief Phase 1).
  skip_sub_24h_crypto: true
  # Tiering thresholds applied to Gamma liquidity/volume fields (USD). Used
  # only as the bootstrap path for a market with no snapshot yet -- once one
  # exists, min_depth_usd below governs (Phase 17 item 2). Liquid thresholds
  # are set so the liquid tier stays ~400 markets: a 5-min snapshot round must
  # finish well inside the cadence at 5 req/s.
  tiers:
    liquid:
      min_liquidity: 100000
      min_volume: 1000000
      # Phase 17 item 2: our own collected order-book depth (bid_depth_usd +
      # ask_depth_usd from the latest snapshot), not Gamma's self-reported
      # liquidity_num -- and never volume_num, which is wash-trading-
      # contaminated (concentrated in sports) and kept as a covariate only.
      # Calibrated 2026-07-07 from the live snapshot depth distribution:
      # currently-liquid markets had median depth ~$1982, p25 ~$381; this sits
      # below p25 so the tier doesn't shrink sharply on cutover.
      min_depth_usd: 250
    tail:
      min_liquidity: 1000
      min_volume: 5000
      # Currently-tail markets had median depth ~$4, p75 ~$70; this sits
      # comfortably above the tail median without reclassifying most of it.
      min_depth_usd: 10
    # Anything below tail thresholds -> 'ignored'.
  # Priority categories for forecasting (brief section 3 universe policy).
  priority_categories:
    - economics        # P1: econ data releases & central-bank decisions
    - weather          # P2: model-drivable where present
    - politics         # P3: long-horizon (>=30d) politics/geopolitics
    - geopolitics      # P3
    - entertainment    # P4: awards, base-rate drivable
  # Structurally unforecastable: never forecast targets, kept out of universe
  # except where noted (calibration stats keep extreme-priced markets).
  excluded_categories:
    - crypto
    - equities
  # Markets priced beyond these bounds stay in calibration stats but are
  # never forecast targets (oracle/dispute tail risk dominates).
  forecast_price_bounds: [0.05, 0.95]
  # Null control: random sample of sports markets, cheap models only.
  null_control:
    category: sports
    sample_size: 30
    random_seed: 42
    # Whether the venue-wide snapshot rounds also collect the sports markets
    # that are NOT in the sample. false from 2026-09-07 (PAP 9.26), wired to
    # Kalshi's rounds only -- see kalshi_collector.drop_unsampled_sports for
    # why not Polymarket's. These markets can never become forecast targets
    # (the eligibility filter drops them before anything else), so every
    # request spent on them buys no research observation, and on Kalshi they
    # had grown to 73% of the venue's snapshot budget: the NFL/NCAA season
    # added 4,333 sports markets in ten days, the round stopped fitting inside
    # its own freshness bound, and the venue fell out of the forecastable
    # population entirely on 2026-09-02/03.
    # true restores the pre-2026-09-07 behaviour byte-for-byte.
    snapshot_unsampled: false

# --- Collection ---------------------------------------------------------
collect:
  snapshot_interval_minutes:
    liquid: 5
    tail: 60
  # In-flight book fetches per Polymarket round; the TokenBucket still caps the
  # RATE (guardrail 8), this only decides how much of the permitted 10 req/s a
  # latency-bound round can actually reach. Sequential awaits reached 3.9 req/s.
  #
  # 1 -> 8 on 2026-08-18 (PAP 9.21), as a margin decision rather than a rescue.
  # The misfire fix earlier the same day (PAP 9.20) had already restored the
  # tail to its configured 60-minute cadence, but the round itself takes ~12
  # minutes, which puts the median tail snapshot age at 71.4 min against
  # guardrail 13's 90-minute bound -- inside it, with 2% over, and with almost
  # nothing to spare. One slow or skipped round pushes a large share of the
  # tail past the bound and straight out of the forecast population, which is
  # exactly the failure this project just spent a day tracing. At 8 in flight
  # the round is ~5 minutes and the margin comes back.
  snapshot_concurrency: 8
  # Was briefly 5/3000 on 2026-07-03 to clear a 10.8k resolution backlog
  # (a one-time consequence of the closed=false Gamma-filter bug fix); backlog
  # cleared to steady-state (~500, mostly genuinely-not-yet-resolved markets)
  # within ~1.5h, so back to a normal cadence -- no reason to keep hammering
  # Gamma once there's no backlog left to work through.
  resolution_poll_minutes: 30
  # Candidates checked per watch_resolutions() cycle. Raised 300 -> 1000 on
  # 2026-07-25, when the scan was found to be re-reading the same head every
  # cycle (see resolutions.unresolved_closed_markets) and the working set had
  # reached ~42k markets. The comment this replaces reasoned that a bigger
  # batch would "re-scan thousands of still-pending markets every cycle for no
  # benefit" -- true of the old no-ORDER-BY scan, which really did re-read the
  # same rows; with the round-robin cursor a bigger batch instead sweeps the
  # whole backlog proportionally faster. 1000/cycle at a 30-min cadence is a
  # full sweep in ~21h (vs ~3 days at 300), and averages 0.55 req/s against a
  # 10 req/s global budget, so it does not meaningfully compete with the
  # snapshot loops for the token bucket. The watcher is also the ONLY thing
  # that notices a market has closed -- sync_universe queries closed="false"
  # and so never sees them -- which is why sweep latency is worth paying for.
  resolution_backlog_limit: 1000
  # Order-book levels stored per side in snapshots (historical depth is
  # unrecoverable later; models don't consume it yet).
  book_depth_levels: 10
  # Global async token bucket shared by all Polymarket hosts. Brief section 3
  # notes read limits are generous (thousands per 10s); this stays well below
  # that while cutting the ~4.4k-market tail-tier round from ~15min to ~7.5min.
  rate_limit:
    requests_per_second: 10
    burst: 20
  # Kill file: when present, all polling halts within one cycle.
  pause_file: data/PAUSE

# --- Forecasting --------------------------------------------------------
forecast:
  # Once per market per day per model...
  cadence_hours: 24
  # ...plus an extra forecast when |24h price move| exceeds this.
  price_move_trigger: 0.10
  # Minimum hours since the last forecast before the price-move trigger may
  # fire again. Inert under the normal once-a-day bundle (age is ~24h by then);
  # it exists so a catch-up storm cannot re-fire the same 24h move hourly, as
  # happened 2026-08-02..06 (up to 25 forecasts per market-day). Added
  # 2026-08-06; see docs/pre_analysis_plan.md addendum 9.5.
  price_move_min_hours: 6
  # Probabilities clamped to this range before writing to the ledger.
  p_clamp: [0.01, 0.99]
  # Price freshness guard (brief guardrail 13): skip forecast if the latest
  # snapshot is older than this, per tier.
  max_snapshot_age_minutes:
    liquid: 15
    tail: 90
  # M3 runs only on the liquid tier: top-K by liquidity within priority
  # categories -- a deterministic rule, never editorial judgment.
  #
  # Raised 20 -> 120 on 2026-08-06, a deliberate operator choice recorded in
  # docs/pre_analysis_plan.md addendum 9.6. Rationale, measured: at K=20 the
  # LLM pipeline had accumulated 4 resolved event clusters in five weeks (32
  # resolved rows from 694 forecasts, 4.6% yield -- the priority-category
  # liquid pool is 92% longer than 30 days to resolution), which leaves both
  # the Phase 7 aggregator refit gate (`learn.m3_min_resolved: 150`, never yet
  # reached) and the Phase 15 boundary-randomization experiment without any
  # resolved outcomes to work with before the 2026-12-31 analysis freeze.
  # Cost is not the constraint and never was: $0.00081 per evidence run means
  # K=120 costs ~$0.097/day against `llm.daily_cost_cap_usd: 5.00` (2% of it).
  # This does NOT make an M3 skill claim reachable -- 200 clusters is out of
  # range either way -- and the addendum says so.
  m3_top_k: 120
  # M3b (brief section 6): the same LLM states a probability directly, on the
  # same markets, reading the same dossier M3 just built -- so the arms differ
  # only in whether the final number comes from the deterministic aggregator or
  # from the model. Enabled 2026-08-11; it had been implemented and never wired
  # in, so it had produced zero forecasts. Costs one extra completion per M3
  # target (~120/day) and no extra retrieval. Never joins POOLABLE: it is a
  # comparison arm, not an ensemble member. See PAP addendum 9.16.
  m3b_direct_enabled: true
  # Phase 15 boundary-randomization experiment (guardrail 12's pre-specified,
  # seeded-randomization carve-out): markets ranked m3_top_k-10..+10 are
  # randomly assigned to M3 coverage instead of a hard cutoff, to identify
  # M3's marginal contribution causally. Enabled 2026-07-12 -- a deliberate
  # operator choice, not a silent behavior change (see CLAUDE.md v2.10):
  # M3's live targeting/cost profile shifts from a hard top-K cutoff to the
  # randomized band from this point forward. Seed is fixed and committed
  # (mirrors universe.null_control.random_seed's pattern), never rolled
  # fresh per run.
  m3_boundary_randomization_enabled: true
  m3_boundary_random_seed: 43

# --- LLM ----------------------------------------------------------------
llm:
  # anthropic | deepseek (OpenAI-compatible)
  provider: deepseek
  model: deepseek-chat
  base_url: https://api.deepseek.com/v1
  api_key_env: DEEPSEEK_API_KEY
  # Hard daily USD cap enforced in code before each call.
  daily_cost_cap_usd: 5.00
  pricing:
    input_per_mtok: 0.14
    output_per_mtok: 0.28

# --- News retrieval (M3) --------------------------------------------------
news:
  # Google News RSS is always used; extra RSS feeds are optional.
  rss_feeds: []

# --- M3 aggregation defaults (refit monthly via `lab learn`) -------------
m3:
  k: 0.15                 # per-item log-odds contribution scale
  tau_days: 5             # recency decay time constant
  max_shift_logodds: 0.8  # cap on total shift per run

# --- Evaluation ---------------------------------------------------------
eval:
  calibration_bins: 10
  bootstrap_iterations: 2000
  # Honesty thresholds (brief section 7).
  n_insufficient: 200
  n_preliminary: 500
  # Reporting windows: all-time and trailing-90-days only. No cherry-picking.
  windows: [all_time, trailing_90d]
  clv_horizons_hours: [24, 72]
  # Phase 17 item 4: CLV validity diagnostic -- correlation of per-forecast
  # signed drift with per-forecast realized paired-Brier skill on the sports
  # null control. |correlation| > clv_null_control_max_corr with n at least
  # clv_null_control_min_n flags the CLV metric untrusted lab-wide.
  clv_null_control_min_n: 30
  clv_null_control_max_corr: 0.15
  # Anytime-valid confidence sequence (brief section 7, Phase 11) -- kept
  # separate from the bootstrap's own implicit alpha (fixed at 0.05 in
  # scoring.cluster_bootstrap_ci) in case they're ever tuned independently.
  confidence_sequence:
    alpha: 0.05
  # Phase 16 (v2.4): RPS is scored on an eval_runs row only once >= this many
  # bucketed (negRisk, ordered-bucket) events have resolved for that
  # model/venue/category/window -- the phase's own literal threshold.
  min_bucketed_events: 20

# --- Shadow portfolio (SIMULATION only) ----------------------------------
shadow:
  bankroll_sim_usd: 10000
  min_edge: 0.05
  max_spread: 0.03
  min_depth_usd: 500
  entry_price_bounds: [0.05, 0.95]
  kelly_fraction: 0.2
  per_market_cap: 0.05
  per_category_cap: 0.20
  # Slippage haircut proportional to (stake / visible depth), capped.
  slippage_coefficient: 0.5
  slippage_cap: 0.02
  # Phase 15: real, sourced per-venue taker-fee rates (net-of-cost accounting,
  # brief section 8/15) -- see the file itself for sources and the derived
  # fee_usd = stake * rate * (1 - entry_price) formula.
  fee_schedule_path: data/fee_schedule.yaml

# --- Learning loop (monthly `lab learn`) ---------------------------------
learn:
  m3_min_resolved: 150     # gate for M3 aggregator walk-forward fit
  m4_min_resolved_per_category: 100  # equal weights below this
  postmortem_decile: 0.10  # top decile of misses and wins each month
  # Safeguards (brief section 6 / Phase 7.1). Learning is dry-run by default;
  # `lab learn --apply` commits, and every change is versioned + reversible.
  max_step_pct: 0.20       # no live parameter moves more than 20% (relative) per cycle
  rollback_window: 50      # trailing resolved forecasts the rollback breaker scores over
  promotion_min_n: 200     # min resolved markets before a CI-gated promotion can fire
  # M5 macro surprise distribution: fit on FRED's own point-in-time GDPNOW/PCENOW
  # history vs realized BEA releases (no ALFRED vintage query needed -- see
  # learn/refit.py). Requires FRED_API_KEY; skipped without one.
  m5_macro:
    min_quarters: 12         # skip a series with fewer paired (nowcast, actual) quarters
    validation_quarters: 8   # trailing quarters held out for the walk-forward split
  # Extremization exponent fits (Phase 13, CLAUDE.md M4/M7 extremization).
  # Below these, a category (M4) / overall (M7) stays at a=1.0 (no extremization) --
  # the same "insufficient data" default as everywhere else in this project.
  m4_extremization_min_n: 60   # per-category resolved m4_ensemble forecasts needed
  m7_extremization_min_n: 60   # resolved m7_crossvenue forecasts needed (single pooled fit)
  # Weight floor/ceiling (Phase 14.1, v2.2 parity): the incumbent monthly M4
  # weight fit gets the SAME per-model protection given to the MWU challenger
  # below, so it isn't less protected against streak-driven concentration
  # than the challenger trying to unseat it.
  m4_weight_floor: 0.02
  m4_weight_ceiling: 0.60
  # Shadow MWU ensemble weighting (Phase 14.1). Nightly (inside `lab eval`,
  # not the monthly `lab learn` cycle) -- guardrail 17's one narrow, explicit
  # exception to guardrail 14, because it touches only meta-level ensemble
  # weights, never model internals.
  mwu:
    correlation_cluster_threshold: 0.8   # pairwise rho >= this groups models for the cluster ceiling
    probation_days: 90                    # minimum age of the first mwu-tagged version before promotion is even considered
    probation_min_n: 200                  # per-category resolved forecasts required, mirrors promotion_min_n's honesty tier

# --- Orchestrator schedule (`lab run`) ----------------------------------
# The one-button process keeps the collector running and fires these analytics
# jobs on cron triggers. All times are UTC (crontab syntax: m h dom mon dow).
schedule:
  # Spacing rationale (2026-07-28, after a 2026-07-27 incident): the six
  # analytics jobs below (forecast bundle, shadow, learn, map_propose,
  # pmxt_verify x2, paper_export) each run in their own asyncio.Lock, so two
  # of them were always free to execute CONCURRENTLY on the same process --
  # nothing serialized them, only the clock did, informally. On 2026-07-27
  # lab-run was OOM-killed by the kernel with only a 3h margin between the
  # nightly forecast bundle's old 02:00 slot and map_propose's old 05:00-
  # Monday slot -- close enough in time to be a plausible collision (report
  # rendering now runs over a much larger resolved-forecast set since the
  # 2026-07-25 resolution-watcher fix started draining a 3-week backlog), but
  # the process had gone quiet for over 2h before the kill, so the exact
  # trigger was never confirmed from logs alone. It self-healed regardless
  # (single restart, no crash loop -- the failure mode fixed 2026-07-20 --
  # ~2h of missed snapshots, no data loss). Whether or not that specific
  # overlap was the cause, nothing was stopping it, so the fix belongs at the
  # schedule level rather than resting on the crash being survivable.
  # Below, every job on the busiest possible day (a 1st-of-month that's also
  # a Sunday or Monday) keeps a >=2h gap from its neighbors, and the daily
  # forecast bundle -- the heaviest, most duration-variable job -- gets a
  # >=5h head start over anything that could follow it same-day. This is
  # belt; economy/analytics_lock.py's cross-service mutex (added the same day)
  # is the suspenders -- it makes the actual guarantee (jobs never overlap)
  # hold even if a job someday runs long enough to blow through this spacing.
  # (The mutex lives in collect/runner.py's _build_analytics_services, next
  # to the per-service locks it complements.)
  forecast_cron: "0 2 * * *"    # nightly 02:00 UTC -> forecast, eval
  # Weekly, not nightly, since 2026-07-28. The HTML report renders data the
  # nightly bundle has already committed, so its freshness is an operator
  # convenience rather than a research requirement -- while each render costs
  # a ~834MB, ~3-minute child process on a 967MB host, and in-process it was
  # taking the collector down with it. `lab report` stays available on demand
  # whenever a fresher page is wanted.
  # Moved 06:00 -> 12:00 on 2026-08-05: at 06:00 it sat only 4h after the
  # nightly bundle, inside the >=5h margin the spacing test requires of the
  # heaviest job. It had never been checked against that rule -- report was
  # missing from the test's job list until learn's removal prompted a review.
  # Weekday as a NAME, not a number: APScheduler's `from_crontab` reads
  # day-of-week 0 as MONDAY, the opposite of standard cron, so every
  # numeric weekly expression here fired a day later than it read
  # (verified 2026-08-16 against the live stamps: paper_export and report
  # on Monday, map_propose on Tuesday). Names parse unambiguously.
  report_cron: "0 14 * * sun"     # weekly Sunday 14:00 UTC -> render the report
  # Daily, per CLAUDE.md section 8's own wording ("Entry rule (evaluated daily
  # on liquid tier, using M4)"). It had been weekly since inception -- a 7x cut
  # in entry opportunities that went unnoticed until 2026-08-09, when the
  # portfolio was found holding 3 resolved trades after a month. Combined with
  # the 1s misfire grace fixed the same day (which dropped most of even the
  # weekly firings), it had effectively evaluated entries three times in a
  # month. Exposure was never the constraint: 25.5% of bankroll deployed, the
  # largest category at 9.2% of its 20% cap. See PAP addendum 9.7 -- this feeds
  # H2's net-of-cost proxy, so it is disclosed, not just fixed.
  shadow_cron: "0 7 * * *"      # daily 07:00 UTC -> shadow portfolio (was weekly Sunday)
  # learn_cron REMOVED 2026-08-05: `lab learn` no longer runs from this
  # process. It has its own systemd unit and timer (docs/VPS_OPERATIONS.md),
  # because a child process does not leave its parent's cgroup -- running the
  # monthly loop here made it share the collector's memory budget and it was
  # OOM-killed at 84s doing so, while the same job standalone finishes in 101s.
  # Disabled 2026-07-20 -- was the retry engine in a self-sustaining OOM crash
  # loop on the VPS: report_job routinely fails to complete under memory
  # pressure (src/lab/eval/report.py's redundant, unprojected full-history
  # snapshot reads -- see CLAUDE.md-adjacent investigation, 2026-07-20), and
  # since a killed run never reaches record_job_run(), the bundle stays
  # permanently "overdue" -- so every restart (including the OOM-triggered
  # ones) unconditionally re-ran the exact operation that just got killed,
  # with zero backoff. Once report_job's memory footprint is fixed (real
  # follow-up), this can safely go back to true; until then the nightly cron
  # (forecast_cron above) and the hourly overdue-catch-up are the only
  # triggers, both already backed by their own age-threshold gating.
  run_on_start: false
  # Missed-run catch-up. If a service's last successful run is older than its
  # control time (max allowed age), the orchestrator runs it immediately -- on
  # startup and again whenever the hourly health check notices a window was missed.
  control:
    forecast_max_age_hours: 24     # nightly bundle should run at least daily
    shadow_max_age_hours: 48       # daily -> 2 days of slack before catch-up
    # learn_max_age_hours REMOVED 2026-08-05 along with the hourly catch-up
    # that used it. The hold it briefly held (2000h) was only ever suppressing
    # a retry loop whose real cause was db.connect() taking the write lock on
    # every open; that is fixed, and learn now runs from its own timer, so
    # there is no orchestrator-side overdue check for it to gate.       # monthly -> 30 days
    pmxt_verify_max_age_hours: 18  # twice-daily -> catch-up if a ~12h cycle is missed
    paper_export_max_age_hours: 192  # weekly -> 8 days (small buffer over the 7-day cadence)
  # Hourly health/liveness check: re-runs overdue analytics services and forces
  # a collection cycle if the collector has stalled (liquid snapshots too old).
  health_check_interval_minutes: 60

# --- Watchdog (optional supervisor) ---------------------------------------
# `lab watchdog` runs `lab run` as a child process and auto-restarts it after
# any exit (crash or otherwise). The delay is deliberate: it gives an operator
# a window to notice something is wrong before the watchdog silently
# resurrects a process that might be crash-looping, and it avoids hammering
# Polymarket's API with restart attempts if something is actually broken.
watchdog:
  restart_delay_seconds: 600   # 10 minutes

# --- Phase 18: dead-man heartbeat (optional) ------------------------------
# Outbound-only ping to a healthchecks.io-class endpoint; HEARTBEAT_URL unset
# in .env means this is silently off (brief S12 carve-out -- an outbound
# ping is not a notification bot; the external monitoring service does the
# alerting, our code never does). Both the collector loop (this interval)
# and the nightly backup job ping the SAME url at their own natural cadence
# -- if setting this up for real, prefer healthchecks.io's "Cron" check type
# over "Simple", since two different cadences hit one check.
ops:
  heartbeat_interval_minutes: 5

# --- Cross-venue signal (M7, Phase 9, optional) --------------------------
# `data/markets_map.yaml` is the confirmed-pairs source of truth (hardcoded
# path, same precedent as M6's links.yaml). `lab map propose` only covers
# Kalshi -- Metaculus's public API now requires an account/API token as of
# 2026-07-03 (see api/metaculus.py), so a Metaculus pair must be hand-curated
# via `lab map confirm --venue metaculus`.
cross_venue:
  # 20 -> 40: live diagnosis found Kalshi's per-category economics/rate-decision
  # series frequently have zero currently-open markets at any given moment
  # (they open near the actual meeting date and close/resolve shortly after),
  # so a narrow per-category share missed real overlap that existed just a
  # few events further down each category's list. Doubling casts a wider net
  # per run at a small, LLM-budget-capped cost (guardrail 10).
  propose_top_k: 40        # candidate liquid-tier, priority-category markets per `lab map propose` run
  # Deliberately its OWN budget, not venues.kalshi.max_series_per_sync --
  # that one's tuned for the hourly universe-sync politeness budget; propose
  # runs weekly (propose_cron below) and can afford to check more series per
  # priority category each time.
  propose_series_per_category: 40
  propose_cron: "0 9 * * mon" # weekly, Monday 09:00 UTC (was 05:00 -- see schedule.forecast_cron's
                             # 2026-07-28 comment on the OOM this collided with) -- orchestrator
                             # runs `lab map propose` automatically. It only ever appends to
                             # `proposed`; a human still must run `lab map confirm` before a pair
                             # feeds M7 (propose-then-confirm is a hard requirement, not something
                             # automation may skip).
  # Phase 17 item 3: confirmed pairs only (the human-curated, already-rate-
  # limit-aware markets_map.yaml set) get a much tighter cadence than the
  # tier-wide 5/60-min loops -- the lead-lag hypothesis (PAP H3) is
  # underpowered on a 5-min grid, and finer history can't be captured
  # retroactively. Bounded fan-out: this only ever touches the small,
  # human-confirmed pair set, never the wider universe.
  #
  # 1 -> 2 on 2026-08-09, to match measured reality rather than intent. A round
  # fetches both legs of every confirmed pair (147 and growing) through the
  # global rate limiter, which takes just over a minute, so APScheduler was
  # skipping every second firing ("maximum number of running instances
  # reached") and the realized cadence was already 2 minutes. Two things were
  # wrong with leaving it at 1: the value stated something untrue about the
  # collected grid, and the skip warning fired ~720 times a day, which is
  # exactly the kind of routine noise a real warning hides in. Raise the pair
  # count further and this will need revisiting again -- the constraint is the
  # rate limiter (guardrail 8), and it is not negotiable.
  hf_snapshot_interval_minutes: 2
  # pmxt Router candidates (Claude.md tech-stack row / §12): a THIRD-PARTY
  # tool proposes raw pairs entirely out-of-band via its own separate Windows
  # Scheduled Task (scripts/pmxt_router_scan.py + install-pmxt-scan-task.ps1)
  # -- never imported into src/lab or called from this process. This job only
  # reads the plain data/pmxt_candidates.json that scan writes and runs our
  # own independent LLM check on each pair before it ever reaches `proposed`.
  pmxt_verify_cron: "0 17,21 * * *"  # twice daily, 17:00 and 21:00 UTC (was 06:00/18:00 --
                                      # moved clear of the 02:00-12:00 UTC morning cluster of
                                      # forecast/shadow/paper_export/map_propose/learn, see
                                      # schedule.forecast_cron's 2026-07-28 comment)

# --- Multi-venue collectors (Phase 10, v1.9) -------------------------------
# Each venue gets its OWN TokenBucket instance (per-host rate limiters, brief
# Phase 10) -- not literally the same object as Polymarket's, but likewise
# conservative, so one venue being slow/rate-limited never stalls another.
venues:
  kalshi:
    sync_interval_minutes: 60
    # Was 5 -- live VPS audit (2026-07-14) found a full sequential sweep over
    # ~2871 tracked markets takes ~10-11 min at this host's observed effective
    # throughput, so ~46% of 5-minute ticks were silently discarded by the
    # scheduler (max_instances=1, prior sweep still running). 15 gives honest
    # headroom above the observed worst case instead of a cadence that was
    # covertly running at ~2x its configured interval.
    # 15 -> 30 on 2026-08-10, to match measured reality rather than intent.
    # A round covers ~3,800 markets sequentially and takes about 30 minutes, so
    # APScheduler was skipping every second firing and the collected grid has
    # been 30-minute for some time. The data is intact -- an even 30-minute
    # spacing, no gaps -- but the value stated something untrue, and `tier` also
    # selects the price-freshness bound (guardrail 13), which should be read
    # against the cadence actually achieved. Polymarket's loops are measured at
    # exactly their configured 5/60 minutes and are unchanged.
    # Per tier from 2026-08-18, and the round is now concurrent. One venue-wide
    # job on one interval had made the liquid tier inherit the tail's cadence:
    # measured 2026-08-17, a full round took ~60 minutes for 3,966 markets plus
    # 461 order books, so APScheduler dropped every second firing of a 30-minute
    # interval and the real grid was hourly. Guardrail 13 gives a liquid-tier
    # price 15 minutes before it is too stale to pair a forecast against, so
    # 443 of the 464 liquid Kalshi markets were being dropped at forecast time
    # EVERY night -- and those 464 are exactly the markets PAP addenda 9.9/9.10
    # promoted onto the measured-depth bar, i.e. the best of the venue.
    #
    # Sizing: liquid is 464 markets x 2 requests (market + order book) = ~928,
    # tail is ~3,500 x 1. At the 8 req/s ceiling below that is ~2 minutes and
    # ~7.3 minutes respectively, both comfortably inside their intervals. The
    # old round only reached 1.2 req/s because every await was sequential, not
    # because the limiter was binding.
    snapshot_interval_minutes:
      liquid: 5
      tail: 30
    # In-flight requests per round. The TokenBucket still caps the RATE, so
    # guardrail 8 holds regardless -- this only decides how much of the
    # already-permitted rate a latency-bound round can actually reach.
    snapshot_concurrency: 8
    resolution_poll_minutes: 30
    rate_limit:
      requests_per_second: 8   # brief section 3: Kalshi tolerates ~10 req/s; stay under it
      burst: 16
    # Kalshi's own /series category -> our taxonomy mapping now lives in
    # data/categories.yaml's `kalshi_series` key (Phase 17 item 1 -- a single
    # versioned taxonomy file instead of one hand-maintained map per venue).
    # Crypto/Financials excluded outright -- same "structurally unforecastable"
    # rule as Polymarket (brief section 3 universe policy): these are 15-min
    # crypto price-target markets, the market price IS the forecast.
    excluded_series_categories: ["Crypto", "Financials"]
    max_series_per_sync: 40   # bounds per-cycle series fan-out (politeness + runtime)
    # Rekeyed 2026-08-09 off Kalshi's own `liquidity_dollars`, which reads 0.0
    # for every market it publishes (verified across all 4,822 collected and
    # against a live API sample) -- so the liquid gate could never be met and
    # the whole venue sat in `tail`, invisible to the shadow portfolio. Volume
    # and open interest are both populated. Thresholds from the live
    # distribution on that date: volume > 5,000 selects 788 of 4,822 markets,
    # > 50,000 selects 143. 5,000 keeps the liquid tier around 800, which is
    # one order-book request each per 15-minute round -- comfortably inside
    # Kalshi's ~10 req/s (guardrail 8). Raise it if that round starts to crowd.
    # FALLBACK ONLY, from 2026-08-10. Kalshi now tiers on the same measured
    # order-book depth and the same `universe.tiers.*.min_depth_usd` thresholds
    # as Polymarket (Phase 17 item 2) -- one rule, one bar, both venues. The
    # two depth distributions are close enough to share it: p25/p50 was $10/$45
    # on Kalshi against $9/$66 on Polymarket. These volume/open-interest numbers
    # apply only to a market with no snapshot yet, since depth is unknowable
    # until one exists -- 1,715 of 4,803 Kalshi markets were in that state on
    # the day depth collection started.
    tiers:
      liquid: { min_volume: 5000, min_open_interest: 100 }
      tail: { min_volume: 0, min_open_interest: 0 }

  metaculus:
    snapshot_interval_minutes: 60
    resolution_poll_minutes: 60
    rate_limit:
      requests_per_second: 3
      burst: 6
    # No broad universe sync (brief Phase 10 task text is explicit: snapshots +
    # resolution watcher only) -- Metaculus only ever tracks questions already
    # confirmed in markets_map.yaml; nothing forecastable/collectable until a
    # human confirms a match, same propose-then-confirm gate M7 already uses.

  manifold:
    sync_interval_minutes: 60
    rate_limit:
      requests_per_second: 5
      burst: 10
    max_markets_per_sync: 1000   # bounded, paginated fetch of resolved+open binary markets

# --- Results publishing (private mirror) ----------------------------------
# After every nightly forecast/eval/report bundle, mirror curated results
# (reports, latest forecast export, model artifacts) into a private git
# checkout and push. Curated only -- never the raw data/lab.db or
# data/snapshots/; bulk-copying and pushing the full collected dataset is
# an intentionally manual step (scripts/publish_results.py --raw-data),
# run by hand, not by this automatic job. Never blocks or re-triggers the
# bundle it follows on failure (e.g. no network) -- see jobs.run_publish_job.
publish:
  enabled: true
  results_dir: /root/forecast-lab-results   # LOCAL-ONLY OVERRIDE (2026-07-10, never commit): correct absolute path for this host, ../Polymarket-results resolves wrong here
  # Raw-data backup to the private results repo (brief section 11: "the
  # historical order-book snapshots cannot be re-downloaded later"). Both
  # default OFF -- an operator who wants only the curated nightly mirror
  # (reports/exports/models) gets exactly the pre-existing behavior with no
  # config change. Split into two independent knobs because they have very
  # different LFS costs: snapshots are small/incremental (only new/changed
  # parquet partitions copy) and a dated partition is final once its day
  # rolls over, so LFS stores each one about once -- they push every night
  # for free. data/lab.db is a single ever-growing binary blob with no LFS
  # delta compression: every push uploads its full current size AND leaves
  # the previous copy stored forever.
  #
  # Measured 2026-08-18, and the reason db_interval_days moved 3 -> 7: the db
  # had reached 1.08GB, so ONE push now exceeds the entire free-tier monthly
  # LFS bandwidth (1GB), and the 12 versions pushed since 2026-07-05 had
  # accumulated to 10.8GB of LFS storage against a 1GB free-tier allowance.
  # The original claim here -- that this interval makes the db fit a
  # free-tier plan -- stopped being true once the db passed a gigabyte, and
  # no value of it is true again: weekly cuts the growth rate by more than
  # half (~10 pushes/month -> ~4.3), it does not stop the growth. The real
  # fix is moving the db backup off LFS onto a deduplicating store
  # (restic-class, where an append-mostly SQLite file costs tens of MB a
  # night instead of a gigabyte); until then this knob buys time and the
  # results repo needs a paid LFS data pack. Snapshots are unaffected and
  # should stay here -- LFS suits them.
  raw_data:
    snapshots_enabled: true
    db_enabled: true
    db_interval_days: 7
    # Backs up .env (every API key: DeepSeek/Anthropic, FRED, Metaculus,
    # NewsAPI, HEARTBEAT_URL, PMXT_API_KEY) into the private results repo
    # every night as .env.backup, so losing this laptop doesn't mean
    # re-requesting every key from scratch. No interval gating -- the file
    # is tiny. See publish.sync_env's docstring for the tradeoff: this puts
    # every key ever set into that repo's git history permanently, even
    # after rotation. Confirmed the results repo is a genuinely private
    # GitHub repo before turning this on.
    env_enabled: true
    # Nightly gzipped JSONL of each closed UTC day's appended ledger rows
    # (forecasts, resolutions, evidence_runs), added 2026-08-22. The db above
    # goes weekly, which left the ONE irreplaceable artifact in this project
    # with a seven-day recovery point while the snapshots describing it had a
    # one-day one -- measured five days after a push: 90,767 forecast rows,
    # 9,595 resolutions and 588 evidence runs existed only on the collecting
    # host. A day gzips to a few MB and goes to ordinary git, so this closes
    # the gap without touching the LFS allowance or moving a gigabyte.
    # Stateless: which days are already mirrored is read from the files, never
    # from a watermark that a restore or rollback could desynchronise.
    ledger_increment_enabled: true

# Phase 15 (v2.3): nightly cryptographic pre-registration -- sha256 over each
# closed UTC day's appended forecasts rows, committed to commitments_path in
# THIS repo (not the results mirror above) so a reviewer can later recompute
# the same hash from the DB and confirm the ledger wasn't edited after the
# fact. push:false is a local-testing-only escape hatch -- production always
# pushes, since an unpushed commitment on a public repo verifies nothing.
ledger:
  enabled: true
  commitments_path: docs/ledger_commitments.jsonl
  push: true

# Phase 15 addendum (v2.8): weekly automated `lab export --paper` snapshot,
# committed to the SAME public repo docs/ledger_commitments.jsonl lives in
# (independent verifiability -- see ledger_commitment.py's own docstring).
# Distinct from the on-demand `lab export --paper --out <path>` CLI flow,
# which stays available for one-off manual exports and is unaffected.
paper_export:
  enabled: true
  dir: docs/paper_exports
  cron: "0 11 * * sun"  # weekly, Sunday 11:00 UTC (was 05:00) -- after the nightly bundle's
                       # own ledger-commitment push (02:00) and the weekly shadow job
                       # (now 07:00, see schedule.forecast_cron's 2026-07-28 comment),
                       # so git pushes don't overlap
  push: true

# --- Storage -------------------------------------------------------------
storage:
  db_path: data/lab.db
  snapshots_dir: data/snapshots
  # The M1/M1.x training set. A configured path, not a hardcoded one, for the
  # same reason as every entry here: a test that cannot redirect it copies the
  # real 50MB file instead -- which on 2026-08-22 filled this host's tmpfs
  # /tmp (RAM-backed, 987MB) across one test run and made SQLite report
  # "database or disk is full".
  bootstrap_dir: data/bootstrap
  models_dir: data/models
  logs_dir: data/logs
  reports_dir: reports
